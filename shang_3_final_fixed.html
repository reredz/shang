<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Babi Bau</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffd1dc 0%, #f7b6c8 50%, #ee8fab 100%);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    #chatSection {
      display: none;
    }

    #chatSection.active {
      display: block;
    }

    .chat-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(158, 47, 80, 0.2);
      padding: 30px;
      max-width: 600px;
      margin: 0 auto;
      height: 70vh;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(217, 79, 112, 0.1);
    }

    .chat-header {
      font-size: 24px;
      color: #9e2f50;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 20px;
      padding-right: 10px;
    }

    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(217, 79, 112, 0.1);
      border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(217, 79, 112, 0.3);
      border-radius: 10px;
    }

    .message {
      margin-bottom: 15px;
      animation: slideIn 0.3s ease-out;
    }

    .user-message {
      text-align: right;
    }

    .user-message .message-bubble {
      background: linear-gradient(135deg, #d94f70 0%, #9e2f50 100%);
      color: white;
      display: inline-block;
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .bot-message .message-bubble {
      background: rgba(217, 79, 112, 0.1);
      color: #333;
      display: inline-block;
      padding: 12px 16px;
      border-radius: 18px;
      border-left: 4px solid #d94f70;
      max-width: 80%;
      word-wrap: break-word;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-input-group {
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid rgba(217, 79, 112, 0.3);
      border-radius: 20px;
      font-size: 14px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: all 0.3s ease;
    }

    #userInput:focus {
      outline: none;
      border-color: #d94f70;
      box-shadow: 0 0 10px rgba(217, 79, 112, 0.3);
    }

    .send-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, #d94f70 0%, #9e2f50 100%);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(158, 47, 80, 0.3);
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(158, 47, 80, 0.4);
    }

    .send-btn:active {
      transform: translateY(0);
    }

    /* Rest of original styles... */
    .music-player {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9000;
      background: linear-gradient(135deg, #d94f70 0%, #9e2f50 100%);
      border: none;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 24px;
      box-shadow: 0 5px 15px rgba(158, 47, 80, 0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .music-player:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(158, 47, 80, 0.4);
    }

    .music-player.playing {
      animation: pulse-music 1.5s ease-in-out infinite;
    }

    @keyframes pulse-music {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .music-player-tooltip {
      position: absolute;
      bottom: -40px;
      right: 0;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .music-player:hover .music-player-tooltip {
      opacity: 1;
    }

    .scroll-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: linear-gradient(135deg, #d94f70 0%, #9e2f50 100%);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 24px;
      box-shadow: 0 5px 15px rgba(158, 47, 80, 0.3);
      transition: all 0.3s ease;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 8999;
    }

    .scroll-to-top.show {
      display: flex;
    }

    .scroll-to-top:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(158, 47, 80, 0.4);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .nav-button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #d94f70 0%, #9e2f50 100%);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(158, 47, 80, 0.3);
    }

    .nav-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(158, 47, 80, 0.4);
    }

    .nav-button.active {
      background: linear-gradient(135deg, #9e2f50 0%, #731f3b 100%);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(158, 47, 80, 0.2);
      padding: 50px 40px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(217, 79, 112, 0.1);
    }

    h1 {
      font-size: 32px;
      color: #9e2f50;
      margin-bottom: 15px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    h2 {
      font-size: 28px;
      color: #9e2f50;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 40px;
      font-weight: 300;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="nav-tabs">
    <button class="nav-button active" onclick="showSection('home')">Home</button>
    <button class="nav-button" onclick="showSection('messages')">Let it Out</button>
  </div>

  <!-- Home Section -->
  <div id="home" class="section active">
    <div class="container">
      <h1>Hi Babi! 💗</h1>
      <p class="subtitle">Welcome to our special corner. Click "Let it Out" to chat with me!</p>
    </div>
  </div>

  <!-- Chat Section -->
  <div id="messages" class="section">
    <div class="chat-container">
      <div class="chat-header">Let's Talk 💕</div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-group">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Tell me something..." 
          onkeypress="handleKeyPress(event)"
        />
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // IMPROVED RESPONSE SYSTEM - CONTEXTUAL & HUMAN-LIKE, CONNECTED TO WHAT SHE SAID
    const responsePatterns = [
      {
        keywords: ['love', 'adore', 'love you', 'i love'],
        responses: [
          "I love you too. With all my heart. 💗",
          "You just made my day. I love you so much.",
          "That's exactly what I needed to hear. I love you.",
          "Right back at you, babe. Always and forever. 💕",
          "Me too. More than words could ever say."
        ]
      },
      {
        keywords: ['miss', 'miss you', 'missing you'],
        responses: [
          "I miss you too... so much. When can I see you?",
          "Me too. Can't wait to be with you again. 💔",
          "Missing you just means I love you. See you soon?",
          "Every second without you feels too long. 😔",
          "You're always on my mind when you're not here."
        ]
      },
      {
        keywords: ['hello', 'hi', 'hey', 'sup', 'yo'],
        responses: [
          "Hey! I'm so happy you're here. What's up?",
          "Hi babe! Good to see you. How are you?",
          "Hey gorgeous! Just thinking about you actually. 💕",
          "Hi! You just made my day better instantly.",
          "Hey love! So glad you came to talk to me."
        ]
      },
      {
        keywords: ['how are you', 'how ru', 'you doing'],
        responses: [
          "I'm better now that you're here talking to me. 😊",
          "Really good! Especially since you asked. How are YOU?",
          "Can't complain when you're around, babe.",
          "Happy! Your presence always makes things better.",
          "I'm good. But more importantly, how are you feeling?"
        ]
      },
      {
        keywords: ['thank', 'thanks', 'thankyou', 'salamat', 'gracias'],
        responses: [
          "Of course, babe. You don't ever need to thank me.",
          "Anything for you. That's what I'm here for. 💕",
          "No need! I'd do it a million times over for you.",
          "You're welcome, but honestly, I should be thanking YOU.",
          "Happy to help. You mean everything to me."
        ]
      },
      {
        keywords: ['sorry', 'apologize', 'apologize', 'my bad'],
        responses: [
          "Hey, it's okay. I already forgave you, babe. 💕",
          "Don't worry about it. We're good, I promise.",
          "You know I could never stay upset with you.",
          "There's nothing to apologize for. We're okay.",
          "I love you too much to hold anything against you."
        ]
      },
      {
        keywords: ['happy', 'excited', 'glad', 'amazing', 'awesome'],
        responses: [
          "YES! I love your energy right now! Tell me more! 😄",
          "That makes ME so happy hearing you like this!",
          "Keep that energy going! You're radiating joy. 💕",
          "I love when you're happy like this. Never lose that.",
          "Your happiness is my happiness, babe. So proud of you!"
        ]
      },
      {
        keywords: ['sad', 'down', 'upset', 'hurts', 'depressed'],
        responses: [
          "I'm here for you. Tell me what's wrong, okay? 💙",
          "It breaks my heart seeing you sad. Talk to me?",
          "Whatever it is, we can get through it together.",
          "You don't have to face this alone. I'm here.",
          "Tell me everything. I'm listening and I care."
        ]
      },
      {
        keywords: ['good night', 'goodnight', 'night', 'sleep', 'sweet dreams'],
        responses: [
          "Sleep well, beautiful. Dream of me. 😴💗",
          "Goodnight, love. Can't wait to see you tomorrow.",
          "Sweet dreams! You're the last thing on my mind. 🌙",
          "Sleep tight, babe. Rest well for me, okay?",
          "Night! May your dreams be as sweet as you are. ✨"
        ]
      },
      {
        keywords: ['morning', 'good morning', 'wake up', 'gm'],
        responses: [
          "Good morning, beautiful! You're first thing I think of! 💕",
          "Morning babe! Ready to take on the day together?",
          "Hey gorgeous! How'd you sleep?",
          "Good morning! You made waking up so much better.",
          "Morning! Another day to spend thinking about you. 😊"
        ]
      },
      {
        keywords: ['hungry', 'eat', 'food', 'dinner', 'lunch'],
        responses: [
          "Go eat something, silly! I need you healthy. 🍽️",
          "Take care of yourself and go grab something tasty!",
          "You should eat. Take a break and fuel up, okay?",
          "Go feed that beautiful face! You deserve it.",
          "Hungry? Go get something you love. I'll be here."
        ]
      },
      {
        keywords: ['busy', 'work', 'working', 'tired', 'stressed'],
        responses: [
          "Go do your thing, babe. I'm proud of you. 💪",
          "Work hard! I know you'll crush it like always.",
          "Take a breather when you need to, okay? Don't overdo it.",
          "I'm rooting for you. You got this! 🔥",
          "Remember to take care of yourself too, not just work."
        ]
      },
      {
        keywords: ['jealous', 'jealousy', 'insecure'],
        responses: [
          "You have nothing to worry about. It's only you. 💕",
          "Baby, there's no one else like you. Ever.",
          "Why would I look anywhere else? You're everything.",
          "You're my one and only. Always have been.",
          "Your heart is all I want. Trust me on that."
        ]
      },
      {
        keywords: ['forever', 'future', 'together', 'always'],
        responses: [
          "I want forever with you. No doubts, no hesitation.",
          "Our future looks bright because you're in it. 💕",
          "Forever with you sounds like a dream come true.",
          "Always and forever, babe. That's the plan.",
          "I can't wait to build our future together."
        ]
      },
      {
        keywords: ['beautiful', 'pretty', 'cute', 'gorgeous', 'handsome'],
        responses: [
          "Stop, you're making me blush! 😳 But not as gorgeous as you.",
          "Right back at you times a million, babe! 💗",
          "You have no idea how beautiful you are to me.",
          "You're the gorgeous one here, trust me.",
          "You literally take my breath away sometimes."
        ]
      },
      {
        keywords: ['what are you doing', 'whatcha up to', 'u doing'],
        responses: [
          "Just thinking about you, actually. Always. 💭",
          "Nothing important. This is way better anyway. 😊",
          "Waiting for you to message me, honestly. 💕",
          "Just thinking about how lucky I am to have you.",
          "Literally nothing beats talking to you right now."
        ]
      },
      {
        keywords: ['haha', 'lol', 'hehe', 'laugh', 'funny'],
        responses: [
          "Your laugh is literally the best sound. Keep going! 😄",
          "I love making you laugh. It's my favorite thing.",
          "You're so funny and cute when you laugh like that.",
          "That laugh of yours makes my whole day better.",
          "You're adorable when you're laughing. Never stop. 🥰"
        ]
      },
      {
        keywords: ['picture', 'photo', 'send me', 'show me'],
        responses: [
          "I'd love to see anything from you. You always look amazing. 📸",
          "Of course! I always love seeing your face.",
          "Yes please! I need a dose of you right now. 💕",
          "Absolutely! Send it. I'm ready to be amazed.",
          "Can't wait! You always look beautiful to me."
        ]
      }
    ];

    function getResponse(userMessage) {
      const lowerMessage = userMessage.toLowerCase();
      
      // Check for pattern matches
      for (let pattern of responsePatterns) {
        for (let keyword of pattern.keywords) {
          if (lowerMessage.includes(keyword)) {
            return pattern.responses[Math.floor(Math.random() * pattern.responses.length)];
          }
        }
      }
      
      // Fallback responses - still contextual and warm
      const fallbacks = [
        "You always know how to make me smile. 💕",
        "I like you more every time we talk, you know that?",
        "You're so special to me. Really.",
        "I could talk to you all day long.",
        "You make my heart so happy. 💗",
        "Being with you (even like this) is my favorite.",
        "You're honestly the best part of my day.",
        "I'm so grateful you're in my life.",
        "You make everything feel right. 💕",
        "I just... really like you, okay?"
      ];
      
      return fallbacks[Math.floor(Math.random() * fallbacks.length)];
    }

    function showSection(sectionId) {
      const sections = document.querySelectorAll('.section');
      sections.forEach(section => section.classList.remove('active'));
      
      const buttons = document.querySelectorAll('.nav-button');
      buttons.forEach(button => button.classList.remove('active'));
      
      document.getElementById(sectionId).classList.add('active');
      event.target.classList.add('active');
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const userMessage = input.value.trim();
      
      if (!userMessage) return;
      
      addMessage(userMessage, 'user');
      input.value = '';
      
      setTimeout(() => {
        const botResponse = getResponse(userMessage);
        addMessage(botResponse, 'bot');
      }, 500);
    }

    function addMessage(text, sender) {
      const chatMessages = document.getElementById('chatMessages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}-message`;
      
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;
      
      messageDiv.appendChild(bubble);
      chatMessages.appendChild(messageDiv);
      
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }
  </script>
</body>
</html>
